<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Kinnect</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- Kinnect shell. Runs by double-clicking this file: no server, no modules,
       no fetch, nothing from a CDN. Contract: issue #2. -->

  <header class="top">
    <div class="top-inner">
      <h1 class="brand">Kinnect <span class="brand-ctx">Cape Town · Sat 12 Sep</span></h1>
      <nav class="nav" aria-label="Sections">
        <button type="button" data-view="events">Events</button>
        <button type="button" data-view="ask">Ask</button>
        <button type="button" data-view="meet">Meet</button>
        <button type="button" data-view="find">Find</button>
        <button type="button" data-view="thank">Thank</button>
        <button type="button" data-view="compute">Compute</button>
      </nav>
    </div>
  </header>

  <!-- Keep each <section> on one line with nothing inside it: app.css uses
       :empty to show a placeholder when a feature hasn't mounted. -->
  <main class="views">
    <section id="view-events" class="view" aria-label="Events"></section>
    <section id="view-ask" class="view" aria-label="Ask"></section>
    <section id="view-meet" class="view" aria-label="Meet"></section>
    <section id="view-find" class="view" aria-label="Find"></section>
    <section id="view-thank" class="view" aria-label="Thank"></section>
    <section id="view-compute" class="view" aria-label="Compute"></section>
  </main>

  <!-- Load order matters: seed, then store, then features. -->
  <script src="data.js"></script>
  <script src="store.js"></script>
  <script src="features/events.js"></script>
  <script src="features/ask.js"></script>
  <script src="features/meet.js"></script>
  <script src="features/find.js"></script>
  <script src="features/thank.js"></script>
  <script src="features/compute.js"></script>

  <script>
    (function () {
      var VIEWS = ['events', 'ask', 'meet', 'find', 'thank', 'compute'];
      var buttons = document.querySelectorAll('.nav button');

      // Nav first, so the tabs work even if every feature below blows up.
      // One section visible at a time; the hash mirrors it so a refresh lands
      // you back where you were.
      function show(view) {
        if (VIEWS.indexOf(view) === -1) view = VIEWS[0];
        VIEWS.forEach(function (v) {
          document.getElementById('view-' + v).classList.toggle('active', v === view);
        });
        Array.prototype.forEach.call(buttons, function (b) {
          var on = b.getAttribute('data-view') === view;
          b.classList.toggle('active', on);
          b.setAttribute('aria-current', on ? 'true' : 'false');
        });
        if (location.hash !== '#' + view) location.replace('#' + view);
      }

      Array.prototype.forEach.call(buttons, function (b) {
        b.addEventListener('click', function () { show(b.getAttribute('data-view')); });
      });
      window.addEventListener('hashchange', function () { show(location.hash.slice(1)); });
      show(location.hash.slice(1) || VIEWS[0]);

      // Mount each feature. Guarded twice: a missing file just doesn't mount,
      // and a file that throws only loses its own section — never the page.
      function mount(name) {
        var el = document.getElementById('view-' + name);
        if (!window.store || !window.features || !window.features[name]) return;
        try {
          window.features[name](el, window.store);
        } catch (err) {
          el.innerHTML = '';
          if (window.console) console.error('[kinnect] ' + name + ' failed to mount', err);
        }
      }

      VIEWS.forEach(mount);
    })();
  </script>
</body>
</html>
